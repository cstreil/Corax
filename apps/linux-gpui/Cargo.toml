[package]
name = "corax-linux"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Corax für Linux/Omarchy (GPUI, natives Fenster)"

# Eigenes Workspace: die Linux-App hängt nur per Pfad am Host-Crate, damit der
# Tauri-Workspace in src-tauri unberührt bleibt.
[workspace]

[[bin]]
name = "corax"
path = "src/main.rs"

[features]
# Test-Hooks (Befehlsdatei, synthetische Liste, Korpus-Mails, Messläufe). Nur
# für Messungen auf Tarantino; das Release-Profil baut ohne dieses Feature.
test-hooks = []
default = []

[dependencies]
# Versionen exakt gepinnt: GPUI ist vor 1.0, Blitz ist Beta. Upgrades nur als eigenes Paket.
gpui = "=0.2.2"
corax-host = { path = "../../src-tauri/crates/corax-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Blitz: HTML/CSS-Engine für den Mail-Körper.
blitz-dom = "=0.3.0-beta.4"
blitz-html = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "=0.14.0"
anyrender_vello_cpu = "=0.18.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# HTML-Reinigung (src/html/sanitize.rs). Gleiche Version wie comail-core, damit
# keine zweite Ammonia-Version im Baum landet.
ammonia = "=4.2.5"
# fontique 0.12 importiert Fontconfig-Symbole als freie Funktionen, die
# yeslogic-fontconfig-sys 6.0.1 nicht mehr exportiert; dlopen ist der Weg des Herstellers.
fontique = { version = "=0.12.0", features = ["fontconfig-dlopen"] }

# Netzzugriff für wirklich entfernte Bilder (src/html/fetch.rs): Version und
# Features wie im Kern (comail-core), damit kein zweites TLS-Paket dazukommt.
# reqwest 0.13 im Baum kommt allein über hf-hub und bleibt davon unberührt.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
# Editor (src/editor/): Eingabefeld mit Textspannen für Fett/Kursiv.
gpui-component = "=0.5.1"
# Datei-Dialog für Anhänge über xdg-desktop-portal (kein GTK im Prozess).
# `async-std` statt `tokio`, obwohl der Kern auf tokio läuft: gpui schaltet am
# gemeinsamen ashpd 0.11.1 `async-std` ein, und ashpd deklariert in
# `desktop/secret.rs` zwei `let mut x1` — eins je Laufzeit-Feature. Mit beiden
# Features bricht der Build (E0252/E0061 auf Linux, auf macOS ist ashpd gar
# nicht im Baum). Mit `async-std` gibt es nur eine der beiden Zeilen.
rfd = { version = "=0.16.0", default-features = false, features = ["xdg-portal", "async-std"] }
tokio = { version = "1", features = ["rt", "time", "net"] }

[dev-dependencies]
# Nur für die Tests in tests/: eigener Runtime und #[tokio::test].
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }
# gpui-component 0.5.1 mit Spannen für Fett/Kursiv (vendor/gpui-component/PATCH.md).
gpui-component = { path = "vendor/gpui-component" }
# serde_fmt 1.1.0: störende `From<Error> for fmt::Error` entfernt (siehe vendor/serde_fmt).
serde_fmt = { path = "vendor/serde_fmt" }
