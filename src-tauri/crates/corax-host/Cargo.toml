[package]
name = "corax-host"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Native host for Corax: starts comail-core, isolates its data directory, dispatches JSON commands and forwards UI events"

[lib]
name = "corax_host"
path = "src/lib.rs"

[[bin]]
name = "corax-cli"
path = "src/bin/corax-cli.rs"

[dependencies]
comail-core = { path = "../comail-core" }
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
# The seeder writes the sandbox database through `comail-core`'s repository
# layer, which is plain rusqlite; no async runtime needed for that.
rusqlite = "0.37"
chrono.workspace = true

[dev-dependencies]
tempfile = "3"
# Pre-seed the avatar cache so the contract suite never touches Gravatar.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
